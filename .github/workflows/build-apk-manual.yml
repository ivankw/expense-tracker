name: Manual Build APK & Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag Versi Release (misal: v1.0.0)'
        required: true
        default: 'v1.0.0'
      build_type:
        description: 'Tipe build APK'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      is_prerelease:
        description: 'Tandai sebagai Pre-release?'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Mengunduh Gradle resmi yang bersih langsung di server GitHub Actions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Menggunakan perintah 'gradle' langsung (bukan ./gradlew)
      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: gradle assembleDebug

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' }}
        run: gradle assembleRelease

      - name: Rename APK Output
        id: rename_apk
        run: |
          VERSION="${{ inputs.version_tag }}"
          TYPE="${{ inputs.build_type }}"
          DIR="app/build/outputs/apk/${TYPE}"
          APK_SRC=$(ls ${DIR}/*.apk | head -n 1)
          APK_DEST="${DIR}/ExpenseTracker-${TYPE}-${VERSION}.apk"
          mv "$APK_SRC" "$APK_DEST"
          echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_tag }}
          name: "Release ${{ inputs.version_tag }}"
          draft: false
          prerelease: ${{ inputs.is_prerelease }}
          files: ${{ steps.rename_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
