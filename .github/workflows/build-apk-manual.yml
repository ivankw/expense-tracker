Gunakan event `workflow_dispatch` pada GitHub Actions agar build APK hanya berjalan saat Anda memicunya secara manual melalui tombol di tab **Actions**.

Buat file baru di repositori Anda pada path `.github/workflows/build-apk.yml`:

```yaml
name: Manual Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipe build APK'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: ./gradlew assembleDebug

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' }}
        run: ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}
          path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
