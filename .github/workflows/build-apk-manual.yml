name: Manual Build APK & Auto Increment Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Pilih tipe build APK'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      is_prerelease:
        description: 'Tandai sebagai Pre-release?'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 1. Generate versi otomatis berdasarkan run_number
      - name: Generate Dynamic Version
        id: versioning
        run: |
          BUILD_CODE=${{ github.run_number }}
          VERSION_TAG="v1.0.${BUILD_CODE}"
          VERSION_NAME="1.0.${BUILD_CODE}"
          
          echo "version_code=$BUILD_CODE" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      # 2. Membuat keystore statis agar tanda tangan APK selalu identik di setiap build
      - name: Generate static debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 3. Build APK dengan menyuntikkan versi dinamis
      - name: Build APK with Dynamic Version
        run: |
          TYPE="${{ inputs.build_type }}"
          TASK="assembleRelease"
          if [ "$TYPE" = "debug" ]; then
            TASK="assembleDebug"
          fi
          
          gradle $TASK \
            -PcustomVersionCode=${{ steps.versioning.outputs.version_code }} \
            -PcustomVersionName=${{ steps.versioning.outputs.version_name }}

      # 4. Ubah nama output APK
      - name: Rename APK Output
        id: rename_apk
        run: |
          TYPE="${{ inputs.build_type }}"
          TAG="${{ steps.versioning.outputs.version_tag }}"
          DIR="app/build/outputs/apk/${TYPE}"
          
          APK_SRC=$(ls ${DIR}/*.apk | head -n 1)
          APK_DEST="${DIR}/ExpenseTracker-${TYPE}-${TAG}.apk"
          
          mv "$APK_SRC" "$APK_DEST"
          echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT

      # 5. Publikasikan rilis ke GitHub Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.version_tag }}
          name: "Release ${{ steps.versioning.outputs.version_tag }}"
          body: |
            ## Pembaruan Otomatis
            - **Versi Aplikasi:** `${{ steps.versioning.outputs.version_name }}`
            - **Version Code:** `${{ steps.versioning.outputs.version_code }}`
            - **Tipe Build:** `${{ inputs.build_type }}`
          draft: false
          prerelease: ${{ inputs.is_prerelease }}
          files: ${{ steps.rename_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
