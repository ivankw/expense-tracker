name: Manual Build APK & Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag Versi Release (misal: v1.0.0 atau build-1)'
        required: true
        default: 'v1.0.0'
      build_type:
        description: 'Tipe build APK'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      is_prerelease:
        description: 'Tandai sebagai Pre-release?'
        required: true
        default: false
        type: boolean

# Wajib: Berikan izin menulis ke konten repositori untuk membuat Release
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: ./gradlew assembleDebug

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' }}
        run: ./gradlew assembleRelease

      # Mengganti nama APK agar rapi saat diunggah ke Releases
      - name: Rename APK Output
        id: rename_apk
        run: |
          VERSION="${{ inputs.version_tag }}"
          TYPE="${{ inputs.build_type }}"
          DIR="app/build/outputs/apk/${TYPE}"
          
          # Cari file APK pertama di direktori output
          APK_SRC=$(ls ${DIR}/*.apk | head -n 1)
          APK_DEST="${DIR}/ExpenseTracker-${TYPE}-${VERSION}.apk"
          
          mv "$APK_SRC" "$APK_DEST"
          echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT

      # Upload ke GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_tag }}
          name: "Release ${{ inputs.version_tag }}"
          body: |
            ## Pembaruan Aplikasi
            - Tipe Build: **${{ inputs.build_type }}**
            - Versi/Tag: **${{ inputs.version_tag }}**
            - Tanggal Build: ${{ github.event.repository.updated_at }}
          draft: false
          prerelease: ${{ inputs.is_prerelease }}
          files: ${{ steps.rename_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
