name: Manual Build APK & Auto Increment Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Pilih tipe build APK'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      is_prerelease:
        description: 'Tandai sebagai Pre-release?'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Dynamic Version
        id: versioning
        run: |
          BUILD_CODE=${{ github.run_number }}
          VERSION_TAG="v1.0.${BUILD_CODE}"
          VERSION_NAME="1.0.${BUILD_CODE}"
          
          echo "version_code=$BUILD_CODE" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      # Generate keystore permanen jika belum ada dan paksa commit dengan flag -f
      - name: Ensure permanent keystore exists
        run: |
          if [ ! -f release.keystore ]; then
            echo "Keystore belum ada. Membuat release.keystore permanen..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias mykey \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass password123 \
              -keypass password123 \
              -dname "CN=ExpenseTracker, OU=Mobile, O=Apps, L=Jakarta, ST=Jakarta, C=ID"

            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f release.keystore
            git commit -m "chore: add permanent release keystore [skip ci]" || echo "No changes to commit"
            git push origin HEAD:${{ github.ref }} || echo "Push skipped or already up to date"
            echo "Keystore berhasil disimpan permanen ke repositori."
          else
            echo "Keystore permanen sudah ada di repositori. Menggunakan file yang ada."
          fi

      - name: Build APK with Dynamic Version
        run: |
          TYPE="${{ inputs.build_type }}"
          TASK="assembleRelease"
          if [ "$TYPE" = "debug" ]; then
            TASK="assembleDebug"
          fi
          
          gradle $TASK \
            -PcustomVersionCode=${{ steps.versioning.outputs.version_code }} \
            -PcustomVersionName=${{ steps.versioning.outputs.version_name }}

      - name: Rename APK Output
        id: rename_apk
        run: |
          TYPE="${{ inputs.build_type }}"
          TAG="${{ steps.versioning.outputs.version_tag }}"
          DIR="app/build/outputs/apk/${TYPE}"
          
          APK_SRC=$(ls ${DIR}/*.apk | head -n 1)
          APK_DEST="${DIR}/ExpenseTracker-${TYPE}-${TAG}.apk"
          
          mv "$APK_SRC" "$APK_DEST"
          echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.version_tag }}
          name: "Release ${{ steps.versioning.outputs.version_tag }}"
          body: |
            ## Pembaruan Otomatis
            - **Versi Aplikasi:** `${{ steps.versioning.outputs.version_name }}`
            - **Version Code:** `${{ steps.versioning.outputs.version_code }}`
            - **Tipe Build:** `${{ inputs.build_type }}`
          draft: false
          prerelease: ${{ inputs.is_prerelease }}
          files: ${{ steps.rename_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
